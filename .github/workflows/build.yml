name: Build BloodStrike Mod APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Create Project Structure
      run: |
        mkdir -p app/src/main/java/com/bloodstrike/mod
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

    - name: Generate Gradle Files
      run: |
        # Root settings
        echo "include ':app'" > settings.gradle
        
        # Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories { 
                google()
                mavenCentral()
            }
            dependencies { 
                classpath 'com.android.tools.build:gradle:8.2.2' 
            }
        }
        allprojects { 
            repositories { 
                google()
                mavenCentral()
            } 
        }
        EOF

        # App build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.bloodstrike.mod'
            compileSdk 34
            defaultConfig {
                applicationId "com.bloodstrike.mod"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            // Add any native libraries here if needed
        }
        EOF

    - name: Generate AndroidManifest.xml
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8" standalone="no"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.bloodstrike.mod">

            <!-- PERMISSIONS -->
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="@string/app_name"
                android:theme="@style/AppTheme">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <service
                    android:name=".OverlayService"
                    android:enabled="true"
                    android:exported="false" />
                
            </application>
        </manifest>
        EOF

    - name: Generate Java Source Code
      run: |
        cat << 'EOF' > app/src/main/java/com/bloodstrike/mod/MainActivity.java
        package com.bloodstrike.mod;
        import android.app.Activity;
        import android.os.Bundle;
        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                startForegroundService(new android.content.Intent(this, OverlayService.class));
            }
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/bloodstrike/mod/OverlayService.java
        package com.bloodstrike.mod;
        import android.app.Service;
        import android.content.Intent;
        import android.os.IBinder;
        import android.view.WindowManager;
        import android.view.Gravity;
        import android.view.View;
        import android.widget.TextView;
        import android.graphics.PixelFormat;

        public class OverlayService extends Service {
            private WindowManager windowManager;
            
            @Override
            public void onCreate() {
                super.onCreate();
                windowManager = (WindowManager) getSystemService(WINDOW_SERVICE);
                
                View view = new TextView(this);
                ((TextView)view).setText("BloodStrike ESP Active");
                ((TextView)view).setTextColor(android.graphics.Color.GREEN);
                
                WindowManager.LayoutParams params = new WindowManager.LayoutParams(
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                    PixelFormat.TRANSLUCENT
                );
                params.gravity = Gravity.TOP | Gravity.LEFT;
                params.x = 0;
                params.y = 0;
                
                windowManager.addView(view, params);
            }

            @Override
            public IBinder onBind(Intent intent) {
                return null;
            }
        }
        EOF

    - name: Generate Resources
      run: |
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">BloodStrike Mod</string>
        </resources>
        EOF
        cat << 'EOF' > app/src/main/res/values/styles.xml
        <resources>
            <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar"></style>
        </resources>
        EOF

    - name: Compile and Build APK
      run: gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bloodstrike-mod-apk
        path: app/build/outputs/apk/debug/app-debug.apk
